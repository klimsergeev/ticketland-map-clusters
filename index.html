<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Схема зала — TLND-15971</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <link rel="stylesheet" href="css/colors_and_type.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/photos.css">
    <link rel="stylesheet" href="css/seatless.css">
</head>
<body>
<div class="app">
    <!-- 1. Шапка — Citrus «Hall / Title / Mobile» -->
    <header class="header">
        <!-- название и крестик -->
        <div class="title">
            <div class="ttl"></div>
            <button class="icon-btn" type="button" aria-label="Закрыть"><img src="assets/title-cross-24.svg" width="24" height="24" alt=""></button>
        </div>
        <!-- строка даты: дата и время сеанса, площадка -->
        <div class="date"><span class="dt"></span><span class="sub"></span></div>
        <!-- легенда цен = фильтр по ценам -->
        <div class="legend"></div>
    </header>

    <!-- 2. Схема зала (пан/зум) -->
    <div class="map-viewport">
        <div class="map-content">
            <!-- инлайн-SVG схемы инжектится из assets/hall.svg (вектор в DOM) -->
            <div class="hall-svg" role="img" aria-label="Схема зала"></div>
        </div>
    </div>

    <!-- 3. Нижний блок: билеты + CTA -->
    <div class="floating">
        <div class="slider"><div class="slider-track"></div></div>
        <button class="cta" type="button"></button>
    </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
